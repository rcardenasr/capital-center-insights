name: Actualizar inteligencia comercial

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run intelligence scheduler
        env:
          ENABLE_CLIENT_GOOGLE_NEWS: "true"
        run: node scripts/run_intelligence.js

      - name: Commit generated intelligence data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update intelligence alerts data"
          file_pattern: data/intel_signals.json data/intel_runs.json
